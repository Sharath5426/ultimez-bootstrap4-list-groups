<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Buttons</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Buttons
                </h1>

                <!-- Standard Buttons -->
                <h3>Standard Buttons</h3>

                <button class="btn btn-primary">Primary</button>
                <button class="btn btn-secondary">Secondary</button>
                <button class="btn btn-success">Success</button>
                <button class="btn btn-danger">Danger</button>
                <button class="btn btn-warning">Warning</button>
                <button class="btn btn-info">Info</button>
                <button class="btn btn-light">Light</button>
                <button class="btn btn-dark">Dark</button>
                <button class="btn btn-link">Link</button>


                <!-- Outline Buttons -->
                <h3 class="mt-4">Outline Buttons</h3>

                <button class="btn btn-outline-primary">
                    Primary Outline
                </button>

                <button class="btn btn-outline-secondary">
                    Secondary Outline
                </button>

                <button class="btn btn-outline-success">
                    Success Outline
                </button>

                <button class="btn btn-outline-danger">
                    Danger Outline
                </button>

                <button class="btn btn-outline-warning">
                    Warning Outline
                </button>

                <button class="btn btn-outline-info">
                    Info Outline
                </button>

                <button class="btn btn-outline-dark">
                    Dark Outline
                </button>


                <!-- Button Sizes -->
                <h3 class="mt-4">Button Sizes</h3>

                <button class="btn btn-primary btn-lg">
                    Large Button
                </button>

                <button class="btn btn-success btn-sm">
                    Small Button
                </button>


                <!-- Block Button -->
                <h3 class="mt-4">Block-Level Button</h3>

                <button class="btn btn-primary btn-block">
                    Full Width Block Button
                </button>


                <!-- Disabled Button -->
                <h3 class="mt-4">Disabled Button</h3>

                <button class="btn btn-danger" disabled>
                    Disabled Button
                </button>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
