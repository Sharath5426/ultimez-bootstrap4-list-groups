<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Add To Cart Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #fff; }
    .task-header { background: #6c757d; color: #fff; border-radius: 6px; }
    .product-img { width: 55px; height: 65px; object-fit: cover; }
    .cart-img { width: 45px; height: 55px; object-fit: cover; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const products = [
      { id: 1, name: 'Men Solid Orange', price: 499, image: 'https://ultimez.com/tasks/assets/images/image1.jpeg' },
      { id: 2, name: 'Men Graphic Print', price: 451, image: 'https://ultimez.com/tasks/assets/images/image2.jpeg' },
      { id: 3, name: 'Men Graphic Print', price: 599, image: 'https://ultimez.com/tasks/assets/images/image3.jpeg' },
      { id: 4, name: 'Men Striped Polo', price: 479, image: 'https://ultimez.com/tasks/assets/images/image4.jpeg' },
      { id: 5, name: 'Men Striped Black', price: 349, image: 'https://ultimez.com/tasks/assets/images/image5.jpeg' },
      { id: 6, name: 'Men Typography', price: 600, image: 'https://ultimez.com/tasks/assets/images/image6.jpeg' },
      { id: 7, name: 'Men Printed Hooded', price: 334, image: 'https://ultimez.com/tasks/assets/images/image7.jpeg' },
      { id: 8, name: 'Embroidered Red Shirt', price: 453, image: 'https://ultimez.com/tasks/assets/images/image8.jpeg' }
    ];

    function App() {
      const [cart, setCart] = useState([]);

      function addToCart(product) {
        setCart(current => {
          const existing = current.find(item => item.id === product.id);
          if (existing) {
            return current.map(item =>
              item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item
            );
          }
          return [...current, { ...product, quantity: 1 }];
        });
      }

      function removeFromCart(id) {
        setCart(current => current.filter(item => item.id !== id));
      }

      const grandTotal = cart.reduce((total, item) => total + item.price * item.quantity, 0);

      return (
        <div className="container py-4">
          <div className="task-header p-4 mb-4">
            <h1 className="h2">Add To Cart Task</h1>
            <p className="mb-0">
              Display products, add products to cart, remove products from cart,
              update quantities and calculate the grand total without page refresh.
            </p>
          </div>

          <h2 className="mb-4">Final Output Result</h2>

          <div className="row">
            <div className="col-lg-7 mb-4">
              <h3>Products List</h3>
              <div className="table-responsive">
                <table className="table table-bordered align-middle">
                  <thead>
                    <tr><th>Image</th><th>Name</th><th>Price</th><th>Action</th></tr>
                  </thead>
                  <tbody>
                    {products.map(product => (
                      <tr key={product.id}>
                        <td><img className="product-img" src={product.image} alt={product.name} /></td>
                        <td>{product.name}</td>
                        <td>Rs. {product.price}</td>
                        <td>
                          <button className="btn btn-warning btn-sm" onClick={() => addToCart(product)}>
                            Add To Cart
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            <div className="col-lg-5">
              <h3>Shopping Cart</h3>
              {cart.length === 0 ? (
                <div className="border rounded p-4 text-center">
                  <h5 className="mb-0">Your shopping cart is empty.</h5>
                </div>
              ) : (
                <>
                  <div className="table-responsive">
                    <table className="table table-bordered align-middle">
                      <thead>
                        <tr><th>Image</th><th>Name</th><th>Price</th><th>Qty</th><th>Subtotal</th><th>Action</th></tr>
                      </thead>
                      <tbody>
                        {cart.map(item => (
                          <tr key={item.id}>
                            <td><img className="cart-img" src={item.image} alt={item.name} /></td>
                            <td>{item.name}</td>
                            <td>Rs. {item.price}</td>
                            <td>{item.quantity}</td>
                            <td>Rs. {item.price * item.quantity}</td>
                            <td>
                              <button className="btn btn-danger btn-sm" onClick={() => removeFromCart(item.id)}>
                                Remove from Cart
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  <div className="text-end border-top pt-3">
                    <h4>Grand Total: Rs. {grandTotal}</h4>
                  </div>
                </>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
