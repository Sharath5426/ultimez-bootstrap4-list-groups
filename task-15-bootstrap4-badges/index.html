<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Badges</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Badges
                </h1>

                <!-- 1. Basic Badges -->
                <h3>Basic Badges</h3>

                <span class="badge badge-primary">Primary</span>
                <span class="badge badge-secondary">Secondary</span>
                <span class="badge badge-success">Success</span>

                <br><br>


                <!-- 2. Pill Badges -->
                <h3>Pill Badges</h3>

                <span class="badge badge-pill badge-primary">
                    Primary Pill
                </span>

                <span class="badge badge-pill badge-success">
                    Success Pill
                </span>

                <span class="badge badge-pill badge-danger">
                    Danger Pill
                </span>

                <br><br>


                <!-- 3. Contextual Badges -->
                <h3>Contextual Badges</h3>

                <span class="badge badge-primary">Primary</span>
                <span class="badge badge-secondary">Secondary</span>
                <span class="badge badge-success">Success</span>
                <span class="badge badge-danger">Danger</span>
                <span class="badge badge-warning">Warning</span>
                <span class="badge badge-info">Info</span>
                <span class="badge badge-light">Light</span>
                <span class="badge badge-dark">Dark</span>

                <br><br>


                <!-- 4. Badges Within Buttons -->
                <h3>Badges Within Buttons</h3>

                <button type="button" class="btn btn-primary">
                    Notifications
                    <span class="badge badge-light">5</span>
                </button>

                <button type="button" class="btn btn-success">
                    Messages
                    <span class="badge badge-light">8</span>
                </button>

                <button type="button" class="btn btn-danger">
                    Alerts
                    <span class="badge badge-light">3</span>
                </button>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
