<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 CDN and Local Files</title>

    <!-- Bootstrap 4 CSS using CDN -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    >

    <!-- Bootstrap 4 CSS using downloaded local file -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">

                <h1 class="text-center mb-5">
                    Introduction of bootstrap 4 using CDN
                </h1>

                <h1 class="text-center">
                    Introduction of bootstrap 4 using local downloaded files
                </h1>

            </div>
        </div>
    </div>

    <!-- Bootstrap 4 JavaScript using CDN -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap 4 JavaScript using downloaded local files -->
    <script src="js/jquery-3.5.1.slim.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
