<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Typography</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <!-- Display Heading -->
                <h1 class="display-1">
                    Bootstrap 4 Typography
                </h1>

                <!-- Left Aligned Paragraph -->
                <p class="text-left">
                    Bootstrap 4 provides useful typography classes that make
                    text easy to style and organize in responsive web pages.
                </p>

                <!-- Right Aligned Paragraph -->
                <p class="text-right">
                    This paragraph is aligned to the right using the
                    Bootstrap 4 text-right class.
                </p>

            </div>

        </div>

    </div>

    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>
    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>
</html>
