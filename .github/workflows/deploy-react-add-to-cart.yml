name: Deploy React Add To Cart

on:
  push:
    branches: [main]
    paths:
      - 'task-react-add-to-cart/**'
      - '.github/workflows/deploy-react-add-to-cart.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-react-add-to-cart/package-lock.json

      - name: Install dependencies
        working-directory: task-react-add-to-cart
        run: npm ci

      - name: Build React app
        working-directory: task-react-add-to-cart
        run: npm run build

      - name: Prepare complete Pages site
        run: |
          mkdir site
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='dist' ./ site/
          rm -rf site/task-react-add-to-cart
          mkdir -p site/task-react-add-to-cart
          cp -r task-react-add-to-cart/dist/. site/task-react-add-to-cart/
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
