<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Carousel</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Carousel
                </h1>

                <!-- Basic Bootstrap 4 Carousel -->
                <div
                    id="carouselExample"
                    class="carousel slide"
                    data-ride="carousel">

                    <!-- Carousel Indicators -->
                    <ol class="carousel-indicators">

                        <li
                            data-target="#carouselExample"
                            data-slide-to="0"
                            class="active">
                        </li>

                        <li
                            data-target="#carouselExample"
                            data-slide-to="1">
                        </li>

                        <li
                            data-target="#carouselExample"
                            data-slide-to="2">
                        </li>

                    </ol>


                    <!-- Carousel Slides -->
                    <div class="carousel-inner">

                        <div class="carousel-item active">

                            <img
                                src="https://placehold.co/1000x400/007bff/ffffff?text=Slide+1"
                                class="d-block w-100"
                                alt="Carousel Slide 1">

                        </div>


                        <div class="carousel-item">

                            <img
                                src="https://placehold.co/1000x400/28a745/ffffff?text=Slide+2"
                                class="d-block w-100"
                                alt="Carousel Slide 2">

                        </div>


                        <div class="carousel-item">

                            <img
                                src="https://placehold.co/1000x400/dc3545/ffffff?text=Slide+3"
                                class="d-block w-100"
                                alt="Carousel Slide 3">

                        </div>

                    </div>


                    <!-- Previous Control -->
                    <a
                        class="carousel-control-prev"
                        href="#carouselExample"
                        role="button"
                        data-slide="prev">

                        <span
                            class="carousel-control-prev-icon"
                            aria-hidden="true">
                        </span>

                        <span class="sr-only">
                            Previous
                        </span>

                    </a>


                    <!-- Next Control -->
                    <a
                        class="carousel-control-next"
                        href="#carouselExample"
                        role="button"
                        data-slide="next">

                        <span
                            class="carousel-control-next-icon"
                            aria-hidden="true">
                        </span>

                        <span class="sr-only">
                            Next
                        </span>

                    </a>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
