<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Spinners</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Spinners
                </h1>

                <!-- 1. Basic Spinner -->
                <h3>Basic Spinner</h3>

                <div
                    class="spinner-border mb-4"
                    role="status">

                    <span class="sr-only">
                        Loading...
                    </span>

                </div>


                <!-- 2. Growing Spinner -->
                <h3>Growing Spinner</h3>

                <div
                    class="spinner-grow mb-4"
                    role="status">

                    <span class="sr-only">
                        Loading...
                    </span>

                </div>


                <!-- 3. Color Spinners -->
                <h3>Color Spinners</h3>

                <div
                    class="spinner-border text-primary mr-3"
                    role="status">

                    <span class="sr-only">
                        Loading...
                    </span>

                </div>

                <div
                    class="spinner-border text-success mr-3"
                    role="status">

                    <span class="sr-only">
                        Loading...
                    </span>

                </div>

                <div
                    class="spinner-border text-danger mr-3"
                    role="status">

                    <span class="sr-only">
                        Loading...
                    </span>

                </div>

                <div
                    class="spinner-border text-warning mr-3"
                    role="status">

                    <span class="sr-only">
                        Loading...
                    </span>

                </div>

                <div
                    class="spinner-border text-info mr-3"
                    role="status">

                    <span class="sr-only">
                        Loading...
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
