<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Custom Form</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Custom Form
                </h1>

                <form>

                    <!-- Checkbox -->
                    <div class="form-group">

                        <label>
                            Select your interests
                        </label>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="java"
                                value="Java">

                            <label
                                class="form-check-label"
                                for="java">

                                Java

                            </label>

                        </div>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="python"
                                value="Python">

                            <label
                                class="form-check-label"
                                for="python">

                                Python

                            </label>

                        </div>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="web"
                                value="Web Development">

                            <label
                                class="form-check-label"
                                for="web">

                                Web Development

                            </label>

                        </div>

                    </div>


                    <!-- Radio Buttons -->
                    <div class="form-group">

                        <label>
                            Select your experience level
                        </label>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="experience"
                                id="beginner"
                                value="Beginner">

                            <label
                                class="form-check-label"
                                for="beginner">

                                Beginner

                            </label>

                        </div>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="experience"
                                id="intermediate"
                                value="Intermediate">

                            <label
                                class="form-check-label"
                                for="intermediate">

                                Intermediate

                            </label>

                        </div>

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="radio"
                                name="experience"
                                id="advanced"
                                value="Advanced">

                            <label
                                class="form-check-label"
                                for="advanced">

                                Advanced

                            </label>

                        </div>

                    </div>


                    <!-- File Upload -->
                    <div class="form-group">

                        <label for="fileUpload">
                            Upload a File
                        </label>

                        <div class="custom-file">

                            <input
                                type="file"
                                class="custom-file-input"
                                id="fileUpload">

                            <label
                                class="custom-file-label"
                                for="fileUpload">

                                Choose file

                            </label>

                        </div>

                    </div>


                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="btn btn-primary mt-3">

                        Submit

                    </button>

                </form>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
