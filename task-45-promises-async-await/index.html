<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises and Async Await</title>
</head>

<body>

    <h2>Promises and Async/Await</h2>

    <button type="button" onclick="callWithPromise()">
        Call API Using Promise
    </button>

    <button type="button" onclick="callWithAsyncAwait()">
        Call API Using Async/Await
    </button>

    <h3>Result:</h3>

    <pre id="demo"></pre>

    <script>

        // ==========================================
        // 1. CALL API USING PROMISE
        // ==========================================

        function callWithPromise() {

            document.getElementById("demo").textContent =
                "Calling API using Promise...";

            fetch("https://jsonplaceholder.typicode.com/posts/1")
                .then(function (response) {

                    if (!response.ok) {
                        throw new Error("API request failed");
                    }

                    return response.json();
                })
                .then(function (data) {

                    console.log("Promise API Response:", data);

                    document.getElementById("demo").textContent =
                        JSON.stringify(data, null, 2);
                })
                .catch(function (error) {

                    console.error("Promise Error:", error);

                    document.getElementById("demo").textContent =
                        "Error: " + error.message;
                });
        }


        // ==========================================
        // 2. CALL API USING ASYNC/AWAIT
        // ==========================================

        async function callWithAsyncAwait() {

            document.getElementById("demo").textContent =
                "Calling API using Async/Await...";

            try {

                const response =
                    await fetch("https://jsonplaceholder.typicode.com/posts/1");

                if (!response.ok) {
                    throw new Error("API request failed");
                }

                const data = await response.json();

                console.log("Async/Await API Response:", data);

                document.getElementById("demo").textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {

                console.error("Async/Await Error:", error);

                document.getElementById("demo").textContent =
                    "Error: " + error.message;
            }
        }

    </script>

</body>

</html>
