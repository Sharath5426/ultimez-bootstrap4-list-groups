<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task On Introduction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        p {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Introduction Task</h1>

    <p id="message">
        This is the original paragraph text.
    </p>

    <button onclick="changeText()">
        Change Text
    </button>


    <script>
        function changeText() {
            document.getElementById("message").textContent =
                "The paragraph text has been changed successfully!";
        }
    </script>

</body>

</html>
