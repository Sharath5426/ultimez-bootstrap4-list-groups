<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Progress Bars</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Progress Bars
                </h1>

                <!-- 1. Basic Progress Bar -->
                <h3>Basic Progress Bar</h3>

                <div class="progress mb-4">
                    <div
                        class="progress-bar"
                        role="progressbar"
                        style="width: 60%;"
                        aria-valuenow="60"
                        aria-valuemin="0"
                        aria-valuemax="100">
                    </div>
                </div>


                <!-- 2. Striped Progress Bar -->
                <h3>Striped Progress Bar</h3>

                <div class="progress mb-4">
                    <div
                        class="progress-bar progress-bar-striped bg-success"
                        role="progressbar"
                        style="width: 70%;"
                        aria-valuenow="70"
                        aria-valuemin="0"
                        aria-valuemax="100">
                    </div>
                </div>


                <!-- 3. Animated Progress Bar -->
                <h3>Animated Progress Bar</h3>

                <div class="progress mb-4">
                    <div
                        class="progress-bar progress-bar-striped progress-bar-animated bg-info"
                        role="progressbar"
                        style="width: 80%;"
                        aria-valuenow="80"
                        aria-valuemin="0"
                        aria-valuemax="100">
                    </div>
                </div>


                <!-- 4. Label in Progress Bar -->
                <h3>Label in Progress Bar</h3>

                <div class="progress mb-4">
                    <div
                        class="progress-bar bg-warning"
                        role="progressbar"
                        style="width: 50%;"
                        aria-valuenow="50"
                        aria-valuemin="0"
                        aria-valuemax="100">
                        50%
                    </div>
                </div>


                <!-- 5. Multiple Progress Bars -->
                <h3>Multiple Progress Bars</h3>

                <div class="progress mb-5">

                    <div
                        class="progress-bar bg-success"
                        role="progressbar"
                        style="width: 30%;"
                        aria-valuenow="30"
                        aria-valuemin="0"
                        aria-valuemax="100">
                        30%
                    </div>

                    <div
                        class="progress-bar bg-info"
                        role="progressbar"
                        style="width: 25%;"
                        aria-valuenow="25"
                        aria-valuemin="0"
                        aria-valuemax="100">
                        25%
                    </div>

                    <div
                        class="progress-bar bg-warning"
                        role="progressbar"
                        style="width: 20%;"
                        aria-valuenow="20"
                        aria-valuemin="0"
                        aria-valuemax="100">
                        20%
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
