<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Image Styling</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Image Styling
                </h1>

                <!-- Responsive Image -->
                <h3>Responsive Image - img-fluid</h3>

                <img
                    src="https://placehold.co/800x400/png"
                    class="img-fluid mb-4"
                    alt="Responsive Bootstrap image"
                >


                <!-- Rounded Image -->
                <h3>Rounded Image - rounded</h3>

                <img
                    src="https://placehold.co/500x300/png"
                    class="rounded mb-4"
                    alt="Rounded Bootstrap image"
                >


                <!-- Thumbnail Image -->
                <h3>Thumbnail Image - img-thumbnail</h3>

                <img
                    src="https://placehold.co/500x300/png"
                    class="img-thumbnail mb-5"
                    alt="Bootstrap thumbnail image"
                >

            </div>

        </div>

    </div>

    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>
    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
