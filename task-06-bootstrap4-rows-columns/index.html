<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Rows and Columns</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            Bootstrap 4 Rows and Columns
        </h1>

        <div class="row align-items-center">

            <!-- Text Column -->
            <div class="col-md-6">
                <h2>Bootstrap 4 Grid System</h2>
                <p>
                    Bootstrap 4 provides a responsive grid system using
                    rows and columns. This column contains text content
                    demonstrating the Bootstrap grid layout.
                </p>
            </div>

            <!-- Image Column -->
            <div class="col-md-6 text-center">
                <img
                    src="https://via.placeholder.com/500x300"
                    class="img-fluid"
                    alt="Bootstrap Grid Example"
                >
            </div>

        </div>

    </div>

    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>
    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>
</html>
