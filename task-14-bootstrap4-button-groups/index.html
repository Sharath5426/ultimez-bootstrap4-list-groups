<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Button Groups</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Button Groups
                </h1>

                <!-- 1. Basic Button Group -->
                <h3>Basic Button Group</h3>

                <div class="btn-group mb-4" role="group">

                    <button type="button" class="btn btn-primary">
                        Left
                    </button>

                    <button type="button" class="btn btn-primary">
                        Middle
                    </button>

                    <button type="button" class="btn btn-primary">
                        Right
                    </button>

                </div>


                <!-- 2. Button Toolbar -->
                <h3>Button Toolbar</h3>

                <div class="btn-toolbar mb-4" role="toolbar">

                    <div class="btn-group mr-2" role="group">

                        <button type="button" class="btn btn-secondary">
                            1
                        </button>

                        <button type="button" class="btn btn-secondary">
                            2
                        </button>

                        <button type="button" class="btn btn-secondary">
                            3
                        </button>

                    </div>

                    <div class="btn-group" role="group">

                        <button type="button" class="btn btn-secondary">
                            4
                        </button>

                        <button type="button" class="btn btn-secondary">
                            5
                        </button>

                    </div>

                </div>


                <!-- 3. Vertical Button Group -->
                <h3>Vertical Button Group</h3>

                <div class="btn-group-vertical mb-4" role="group">

                    <button type="button" class="btn btn-success">
                        Home
                    </button>

                    <button type="button" class="btn btn-success">
                        Profile
                    </button>

                    <button type="button" class="btn btn-success">
                        Settings
                    </button>

                </div>


                <!-- 4. Button Group with Dropdown -->
                <h3>Button Group with Dropdown</h3>

                <div class="btn-group mb-4">

                    <button type="button" class="btn btn-danger">
                        Actions
                    </button>

                    <button
                        type="button"
                        class="btn btn-danger dropdown-toggle dropdown-toggle-split"
                        data-toggle="dropdown"
                        aria-haspopup="true"
                        aria-expanded="false">

                        <span class="sr-only">
                            Toggle Dropdown
                        </span>

                    </button>

                    <div class="dropdown-menu">

                        <a class="dropdown-item" href="#">
                            Edit
                        </a>

                        <a class="dropdown-item" href="#">
                            Delete
                        </a>

                        <a class="dropdown-item" href="#">
                            View
                        </a>

                    </div>

                </div>


                <!-- 5. Nested Button Group -->
                <h3>Nested Button Group</h3>

                <div class="btn-group mb-5">

                    <button type="button" class="btn btn-info">
                        Main
                    </button>

                    <div class="btn-group" role="group">

                        <button
                            type="button"
                            class="btn btn-info dropdown-toggle"
                            data-toggle="dropdown"
                            aria-haspopup="true"
                            aria-expanded="false">

                            More

                        </button>

                        <div class="dropdown-menu">

                            <a class="dropdown-item" href="#">
                                Option 1
                            </a>

                            <a class="dropdown-item" href="#">
                                Option 2
                            </a>

                            <a class="dropdown-item" href="#">
                                Option 3
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
