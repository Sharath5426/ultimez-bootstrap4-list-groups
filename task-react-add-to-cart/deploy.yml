name: Deploy React Add To Cart

on:
  push:
    branches:
      - main
    paths:
      - 'task-react-add-to-cart/**'
      - '.github/workflows/deploy-react.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-react-add-to-cart/package-lock.json

      - name: Install dependencies
        working-directory: task-react-add-to-cart
        run: npm ci

      - name: Build React app
        working-directory: task-react-add-to-cart
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload React build
        uses: actions/upload-pages-artifact@v3
        with:
          path: task-react-add-to-cart/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4