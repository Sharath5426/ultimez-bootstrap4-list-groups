<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arsha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="container navbar">

            <a href="#" class="logo">ARSHA</a>

            <nav>
                <a href="#" class="active">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Portfolio</a>
                <a href="#">Team</a>
                <a href="#">Drop Down⌄</a>
                <a href="#">Contact</a>
                <a href="#" class="get-started">Get Started</a>
            </nav>

        </div>
    </header>


    <main>

        <section class="hero">
            <div class="container hero-content">

                <div class="hero-text">

                    <h1>
                        Better Solutions For Your Business
                    </h1>

                    <p>
                        We are team of talented designers making websites with Bootstrap
                    </p>

                    <div class="hero-buttons">
                        <a href="#" class="btn-primary">Get Started</a>

                        <a href="#" class="watch-video">
                            <span>▶</span>
                            Watch Video
                        </a>
                    </div>

                </div>


                <div class="hero-image">
                    <img src="images/hero-img.png" alt="Business illustration">
                </div>

            </div>
        </section>


        <section class="clients">
            <div class="container clients-list">

                <img src="images/client-1.png" alt="Client">
                <img src="images/client-2.png" alt="Client">
                <img src="images/client-3.png" alt="Client">
                <img src="images/client-4.png" alt="Client">
                <img src="images/client-5.png" alt="Client">
                <img src="images/client-6.png" alt="Client">

            </div>
        </section>

    </main>

</body>
</html>
