<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Table Styling</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Table Styling
                </h1>

                <!-- Bootstrap Table -->
                <table class="table table-striped">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Grade</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>Rahul</td>
                            <td>Java</td>
                            <td>A</td>
                        </tr>

                        <tr>
                            <td>2</td>
                            <td>Ananya</td>
                            <td>Python</td>
                            <td>A+</td>
                        </tr>

                        <tr>
                            <td>3</td>
                            <td>Arjun</td>
                            <td>Web Development</td>
                            <td>B+</td>
                        </tr>

                        <tr>
                            <td>4</td>
                            <td>Priya</td>
                            <td>Bootstrap</td>
                            <td>A</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>
    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
