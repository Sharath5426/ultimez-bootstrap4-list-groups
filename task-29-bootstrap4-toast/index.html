<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Toast Notifications</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Toast Notifications
                </h1>

                <p>
                    Click the button below to display a toast notification.
                </p>

                <!-- Button to Show Toast -->
                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="showToast()">

                    Show Toast

                </button>

            </div>

        </div>

    </div>


    <!-- Toast -->
    <div
        class="toast"
        id="notificationToast"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
        style="position: fixed; top: 20px; right: 20px;">

        <div class="toast-header">

            <strong class="mr-auto">
                Bootstrap Notification
            </strong>

            <small>
                Now
            </small>

            <button
                type="button"
                class="ml-2 mb-1 close"
                data-dismiss="toast"
                aria-label="Close">

                <span aria-hidden="true">
                    &times;
                </span>

            </button>

        </div>

        <div class="toast-body">

            Your notification has been displayed successfully!

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>


    <!-- Toast Initialization -->
    <script>
        function showToast() {
            $('#notificationToast').toast({
                autohide: false
            });

            $('#notificationToast').toast('show');
        }
    </script>

</body>

</html>
