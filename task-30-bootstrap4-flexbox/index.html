<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Flexbox Layout</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >

    <style>
        .flex-item {
            min-height: 120px;
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <h1 class="mb-4 text-center">
            Bootstrap 4 Flexbox Layout
        </h1>

        <!-- Justify Content -->
        <h3>Justify Content</h3>

        <div class="d-flex justify-content-between mb-4 flex-wrap">

            <div class="flex-item bg-primary text-white p-4 m-2">
                Item 1
            </div>

            <div class="flex-item bg-success text-white p-4 m-2">
                Item 2
            </div>

            <div class="flex-item bg-danger text-white p-4 m-2">
                Item 3
            </div>

        </div>


        <!-- Align Items -->
        <h3>Align Items</h3>

        <div
            class="d-flex align-items-center mb-4"
            style="height: 180px;">

            <div class="bg-info text-white p-4 m-2">
                Centered Item 1
            </div>

            <div class="bg-warning text-dark p-4 m-2">
                Centered Item 2
            </div>

            <div class="bg-dark text-white p-4 m-2">
                Centered Item 3
            </div>

        </div>


        <!-- Flex Wrap -->
        <h3>Flex Wrap</h3>

        <div class="d-flex flex-wrap justify-content-center mb-5">

            <div class="flex-item bg-secondary text-white p-4 m-2">
                Box 1
            </div>

            <div class="flex-item bg-primary text-white p-4 m-2">
                Box 2
            </div>

            <div class="flex-item bg-success text-white p-4 m-2">
                Box 3
            </div>

            <div class="flex-item bg-danger text-white p-4 m-2">
                Box 4
            </div>

            <div class="flex-item bg-info text-white p-4 m-2">
                Box 5
            </div>

            <div class="flex-item bg-dark text-white p-4 m-2">
                Box 6
            </div>

        </div>


        <!-- Order -->
        <h3>Flex Order</h3>

        <div class="d-flex flex-wrap mb-5">

            <div class="order-3 bg-primary text-white p-4 m-2">
                Order 3
            </div>

            <div class="order-1 bg-success text-white p-4 m-2">
                Order 1
            </div>

            <div class="order-2 bg-danger text-white p-4 m-2">
                Order 2
            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

</body>

</html>
