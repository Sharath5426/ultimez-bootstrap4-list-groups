<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap 4 Popover</title>

    <!-- Bootstrap 4 CSS - Local File -->
    <link
        rel="stylesheet"
        href="../task-04-bootstrap4-cdn-local/css/bootstrap.min.css"
    >
</head>

<body>

    <div class="container mt-5">

        <div class="row">

            <div class="col-md-12">

                <h1 class="mb-4">
                    Bootstrap 4 Popover
                </h1>

                <p>
                    Click the button below to display the popover.
                </p>

                <!-- Bootstrap 4 Popover -->
                <button
                    type="button"
                    class="btn btn-primary"
                    data-toggle="popover"
                    data-placement="top"
                    title="Bootstrap 4 Popover"
                    data-content="This is a Bootstrap 4 popover that appears when the button is clicked.">

                    Click Me

                </button>

            </div>

        </div>

    </div>


    <!-- Bootstrap 4 JavaScript - Local Files -->
    <script src="../task-04-bootstrap4-cdn-local/js/jquery-3.5.1.slim.min.js"></script>

    <script src="../task-04-bootstrap4-cdn-local/js/bootstrap.bundle.min.js"></script>

    <!-- Initialize Bootstrap Popover -->
    <script>
        $(function () {
            $('[data-toggle="popover"]').popover();
        });
    </script>

</body>

</html>
